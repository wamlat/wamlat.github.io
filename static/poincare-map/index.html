<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poincaré Map — Rössler System</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>Poincaré Map</h1>
            <p class="subtitle">Rössler Attractor · y = 0 cross-section</p>
        </header>

        <div class="layout">
            <aside class="controls">
                <div class="control-group">
                    <div class="param">
                        <div class="param-header">
                            <label for="param-a">a</label>
                            <input type="number" id="a-num" min="0.1" max="0.5" step="0.01" value="0.2" class="num-input">
                        </div>
                        <input type="range" id="param-a" min="0.1" max="0.5" step="0.01" value="0.2">
                    </div>

                    <div class="param">
                        <div class="param-header">
                            <label for="param-b">b</label>
                            <input type="number" id="b-num" min="0.1" max="0.5" step="0.01" value="0.2" class="num-input">
                        </div>
                        <input type="range" id="param-b" min="0.1" max="0.5" step="0.01" value="0.2">
                    </div>

                    <div class="param">
                        <div class="param-header">
                            <label for="param-c">c</label>
                            <input type="number" id="c-num" min="1.0" max="18.0" step="0.1" value="5.7" class="num-input">
                        </div>
                        <input type="range" id="param-c" min="1.0" max="18.0" step="0.1" value="5.7">
                    </div>
                </div>

                <div class="presets">
                    <span class="presets-label">Presets</span>
                    <button class="preset" data-a="0.2" data-b="0.2" data-c="5.7">Classic</button>
                    <button class="preset" data-a="0.1" data-b="0.1" data-c="14.0">Spiral</button>
                    <button class="preset" data-a="0.2" data-b="0.2" data-c="9.0">Funnel</button>
                    <button class="preset" data-a="0.36" data-b="0.4" data-c="4.5">Band</button>
                </div>

                <div id="status" class="status">
                    <div class="status-row">
                        <span class="status-label">Points</span>
                        <span id="point-count" class="status-value">—</span>
                    </div>
                    <div id="warning" class="warning hidden"></div>
                </div>
            </aside>

            <main class="chart-area">
                <div id="loading" class="loading hidden">
                    <div class="spinner"></div>
                    <span>Computing...</span>
                </div>
                <canvas id="chart"></canvas>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
